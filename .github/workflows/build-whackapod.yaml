name: Build Whack-a-Pod Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout whack_a_pod source
        uses: actions/checkout@v4
        with:
          repository: tpryan/whack_a_pod
          path: whack_a_pod

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: whack_a_pod/apps/api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/whack-a-pod-api:latest

      - name: Build and push game
        uses: docker/build-push-action@v5
        with:
          context: whack_a_pod/apps/game
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/whack-a-pod-game:latest

      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context: whack_a_pod/apps/admin
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/whack-a-pod-admin:latest
