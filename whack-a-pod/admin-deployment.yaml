apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: wap-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      serviceAccountName: wap-admin
      containers:
      - name: admin
        image: ghcr.io/fjemag/whack-a-pod-admin:latest
        env:
        - name: NAMESPACE
          value: wap-game
        - name: DOCKERREPO
          value: ghcr.io/fjemag
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: wap-admin
spec:
  selector:
    app: admin
  ports:
  - port: 8080
    targetPort: 8080