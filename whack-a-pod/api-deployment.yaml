apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wap-admin
spec:
  replicas: 12
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: gcr.io/google-samples/whack-a-pod/api:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wap-admin
spec:
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: 8080